version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mindease-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}  # ✅ From .env
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatbot_db}
    ports:
      - "${MYSQL_PORT:-3306}:3306"  # ✅ Configurable port
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mindease-network
    restart: unless-stopped  # ✅ Auto-restart
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      start_period: 30s

  emotion-service:
    build: ./emotion-service
    container_name: mindease-emotion
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-exp}
      - MODEL_NAME=${MODEL_NAME:-j-hartmann/emotion-english-distilroberta-base}
      - PYTHONUNBUFFERED=1
    networks:
      - mindease-network
    restart: unless-stopped  # ✅ Auto-restart
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  chatbot-service:
    build: ./chatbot
    container_name: mindease-backend
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-chatbot_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      
      # Services
      - EMOTION_SERVICE_URL=http://emotion-service:5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # Security
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      
      # CORS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-production}
    depends_on:
      mysql:
        condition: service_healthy
      emotion-service:
        condition: service_healthy
    networks:
      - mindease-network
    restart: on-failure  # ✅ Restart on failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: mindease-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chatbot-service
      - emotion-service
    networks:
      - mindease-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  mysql_data:
    driver: local

networks:
  mindease-network:
    driver: bridge