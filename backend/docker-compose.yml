# version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: chatbot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ANUmitobi18!!
      MYSQL_DATABASE: chatbot_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  emotion-service:
    build: ./emotion-service
    container_name: emotion-service
    ports:
      - "5000:5000"
    environment:
      - MODEL_NAME=j-hartmann/emotion-english-distilroberta-base
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  chatbot-service:
    build: ./chatbot
    container_name: chatbot-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/chatbot_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=ANUmitobi18!!
      - EMOTION_SERVICE_URL=http://emotion-service:5000
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    depends_on:
      mysql:
        condition: service_healthy
      emotion-service:
        condition: service_healthy
    networks:
      - chatbot-network

volumes:
  mysql-data:

networks:
  chatbot-network:
    driver: bridge