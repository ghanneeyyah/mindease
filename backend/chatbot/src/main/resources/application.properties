spring.application.name=chatbot
server.port=${PORT:8081}
server.address=0.0.0.0

# Database Configuration (defaults to in-memory H2; override with SPRING_DATASOURCE_* env vars for MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:chatbot_db;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (set JWT_SECRET in Pxxl environment variables for production)
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=86400000

# CORS Configuration (comma-separated origins in Pxxl env vars)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Python Emotion Service
emotion.service.url=${EMOTION_SERVICE_URL:https://mindease-ai.pxxl.run}

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always