# Docker-specific configuration
server.port=${PORT:8081}
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:chatbot_db;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Emotion Service in Docker
emotion.service.url=${EMOTION_SERVICE_URL:https://mindease-ai.pxxl.run}